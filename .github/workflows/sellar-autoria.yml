name: Sellar autoría

# Sella con OpenTimestamps (anclaje en Bitcoin) cada publicación de la traducción y los registros privados del
# autor, y guarda las pruebas en autoria/. Se ejecuta tras cada publicación, una vez al día (para completar los
# sellos pendientes de confirmar) y a mano. Sus commits los hace el bot con GITHUB_TOKEN, que no dispara otros
# workflows, y solo tocan autoria/, así que nunca provocan una publicación.
on:
  workflow_run:
    workflows: ["Publicar traducción"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "autoria/registro/**"
      - "tools/sellar_autoria.py"
      - ".github/workflows/sellar-autoria.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sellar-autoria
  cancel-in-progress: false

jobs:
  sellar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cliente OpenTimestamps
        run: pip install opentimestamps-client==0.8.0
      - name: Sellar y completar sellos
        run: python tools/sellar_autoria.py --repo "${{ github.repository }}"
      - name: Guardar las pruebas
        run: |
          set -euo pipefail
          git add autoria
          if git diff --cached --quiet; then
            echo "Sin cambios en los sellos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sellos de autoría (OpenTimestamps)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
