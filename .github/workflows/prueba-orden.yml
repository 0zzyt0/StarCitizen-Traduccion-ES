name: Prueba de orden (temporal)
on:
  push:
    branches: [main]
    paths: [".github/workflows/prueba-orden.yml"]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Crear, listar y borrar publicaciones de prueba
        run: |
          set -e
          echo "prueba" > p.txt
          gh release create "traduccion-v0.20261119.99" --repo "$REPO" --target "$GITHUB_SHA" --title "PRUEBA ORDEN A (se borra)" --notes "Prueba temporal" --latest=false p.txt
          gh release create "zz-prueba-orden" --repo "$REPO" --target "$GITHUB_SHA" --title "PRUEBA ORDEN B (se borra)" --notes "Prueba temporal" --latest=false p.txt
          sleep 5
          echo "ORDEN_API:"; gh api "repos/$REPO/releases?per_page=20" --jq '.[].tag_name'
          gh release delete "traduccion-v0.20261119.99" --repo "$REPO" --yes --cleanup-tag
          gh release delete "zz-prueba-orden" --repo "$REPO" --yes --cleanup-tag
          echo "BORRADAS"
