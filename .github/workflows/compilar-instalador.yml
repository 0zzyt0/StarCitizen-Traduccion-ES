name: Compilar instalador

# Compila el gestor (.exe) y el instalador de Windows cuando cambia el código del gestor en main,
# al crear una etiqueta vX.Y.Z o a mano desde la pestaña Actions.
# Si todavía no existe la release v<__version__>, la crea con el instalador (etiqueta "v…": GitHub ordena por
# nombre de etiqueta, así el instalador queda siempre por encima de las traducciones "traduccion-v…"). Si ya existe,
# el instalador solo queda como artifact de la ejecución (para publicar uno nuevo, sube __version__).
# La release del instalador se marca como "Latest" para que esté a primera vista; las traducciones nunca.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "app/**"
      - "assets/**"
      - "config/**"
      - "installer/**"
      - "requirements*.txt"
      - ".github/workflows/compilar-instalador.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  compilar:
    needs: pruebas
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Opcional: certificado de firma de código (evita el aviso de SmartScreen). Vacío = sin firmar.
      CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Dependencias
        run: pip install -r requirements-dev.txt

      - name: Versión
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0,'app'); import sctrad; print(sctrad.__version__)"
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagv = "${{ github.ref_name }}".Substring(1)
            if ($tagv -ne $v) { Write-Error "La etiqueta ($tagv) no coincide con __version__ ($v) en app/sctrad/__init__.py"; exit 1 }
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Pruebas en Windows
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: PyInstaller
        run: pyinstaller installer/SCTraduccionES.spec --noconfirm --clean

      - name: Prueba del ejecutable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\SCTraduccionES\SCTraduccionES.exe" -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "El ejecutable no arranca (código $($p.ExitCode))"; exit 1 }

      - name: Firmar ejecutable (opcional)
        if: ${{ env.CERT_PFX != '' }}
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          & $signtool.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\SCTraduccionES\SCTraduccionES.exe"
          Remove-Item cert.pfx

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $h = (Get-FileHash Output\StarCitizen_Traduccion_ES_Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  StarCitizen_Traduccion_ES_Setup.exe" | Out-File -Encoding ascii Output\StarCitizen_Traduccion_ES_Setup.exe.sha256

      - name: Firmar instalador (opcional)
        if: ${{ env.CERT_PFX != '' }}
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          & $signtool.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "Output\StarCitizen_Traduccion_ES_Setup.exe"
          Remove-Item cert.pfx
          $h = (Get-FileHash Output\StarCitizen_Traduccion_ES_Setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  StarCitizen_Traduccion_ES_Setup.exe" | Out-File -Encoding ascii Output\StarCitizen_Traduccion_ES_Setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: StarCitizen_Traduccion_ES_Setup
          path: Output/*

      - name: Publicar release del gestor (si es una versión nueva)
        shell: pwsh
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            "La release $tag ya existe: el instalador queda solo como artifact. Sube __version__ para publicar otro." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $v = "${{ steps.ver.outputs.version }}"
          python -c "import sys; sys.path.insert(0,'tools'); import organizar_releases as o; open('notas_instalador.md','w',encoding='utf-8').write(o.installer_body('${{ github.repository }}', '$v'))"
          python -c "import sys; sys.path.insert(0,'tools'); import organizar_releases as o; open('titulo.txt','w',encoding='utf-8').write(o.installer_title('$v'))"
          $titulo = (Get-Content -Raw -Encoding utf8 titulo.txt).Trim()
          # El instalador es la publicación «Latest»: sale en la portada del repositorio y el enlace
          # .../releases/latest/download/StarCitizen_Traduccion_ES_Setup.exe siempre baja el último.
          gh release create $tag --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "$titulo" --notes-file notas_instalador.md --latest Output\StarCitizen_Traduccion_ES_Setup.exe Output\StarCitizen_Traduccion_ES_Setup.exe.sha256
